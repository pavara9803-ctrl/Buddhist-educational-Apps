  <!-- data.js with auto cache busting -->
<script>
  (function() {
    const version = new Date().getTime();
    const script = document.createElement('script');
    script.src = 'data.js?v=' + version;
    script.onload = function() {
      // Firebase SDK පසුව load කරන්න
      const fbApp = document.createElement('script');
      fbApp.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js';
      fbApp.onload = function() {
        const fbDb = document.createElement('script');
        fbDb.src = 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js';
        fbDb.onload = function() {
          // Firebase ready වූ පසු download counts load කරන්න
          if (typeof loadAllDownloadCounts === 'function') {
            loadAllDownloadCounts();
          }
        };
        document.body.appendChild(fbDb);
      };
      document.body.appendChild(fbApp);
    };
    document.body.appendChild(script);
  })();
</script>
