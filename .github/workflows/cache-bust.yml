name: Cache Busting

on:
  push:
    branches: [ main ]

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Update version in index.html
        run: |
          VERSION=$(date +%s)
          sed -i "s/data.js?v=[0-9]*/data.js?v=$VERSION/g" index.html
          sed -i "s/main.css?v=[0-9]*/main.css?v=$VERSION/g" index.html
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update cache version"
          git push
